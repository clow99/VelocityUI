name: Build and Deploy VelocityUI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REGISTRY: 10.0.0.2:5000
      IMAGE_NAME: velocityui-docs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify registry connectivity
        run: curl --fail --silent --show-error --max-time 10 "http://${REGISTRY}/v2/"

      - name: Build Docker image
        run: |
          docker build \
            --file Dockerfile \
            --build-arg NEXT_PUBLIC_APP_URL="${{ vars.NEXT_PUBLIC_APP_URL }}" \
            --build-arg NEXT_PUBLIC_APP_NAME="${{ vars.NEXT_PUBLIC_APP_NAME }}" \
            --build-arg NEXT_PUBLIC_ENABLE_LIVE_DATA="${{ vars.NEXT_PUBLIC_ENABLE_LIVE_DATA }}" \
            --build-arg NEXT_PUBLIC_BETA="${{ vars.NEXT_PUBLIC_BETA }}" \
            --label "org.opencontainers.image.revision=${{ gitea.sha }}" \
            --tag "${IMAGE_NAME}:${{ gitea.sha }}" \
            .

      - name: Tag Docker images
        run: |
          docker tag "${IMAGE_NAME}:${{ gitea.sha }}" "${REGISTRY}/${IMAGE_NAME}:${{ gitea.sha }}"
          docker tag "${IMAGE_NAME}:${{ gitea.sha }}" "${REGISTRY}/${IMAGE_NAME}:latest"

      - name: Push Docker images
        run: |
          docker push "${REGISTRY}/${IMAGE_NAME}:${{ gitea.sha }}"
          docker push "${REGISTRY}/${IMAGE_NAME}:latest"
